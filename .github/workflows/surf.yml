name: Publish surf cards

# The cards are now BUILT on Amanda's computer (refresh_surf.ps1), because Surfline blocks GitHub's servers (HTTP 403).
# This workflow only publishes whatever was pushed to surf-live/site. It never contacts Surfline.

on:
  push:
    branches: [main]
    paths:
      - "surf-live/site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: surf-live/site
      - id: deployment
        uses: actions/deploy-pages@v4
