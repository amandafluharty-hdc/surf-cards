<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kauaʻi surf map</title>
<style>
__LEAFLET_CSS__
</style>
<style>
:root{--ink:#19262B;--slate:#566A71;--line:#D5DFE0;--glass:#F2F6F6;--paper:#fff;--black:#111}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;color:var(--ink);background:#dfe7e8;overflow:hidden}
#app{position:relative;height:100%;min-height:420px}
#map{position:absolute;inset:0;background:#dfe7e8}
button{font:inherit;color:inherit}
.leaflet-container{font:inherit}

/* pins */
.pin{display:flex;align-items:center;justify-content:center;min-width:44px;height:28px;padding:0 9px;border-radius:999px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-weight:800;font-size:13px;white-space:nowrap;letter-spacing:.01em;transition:transform .12s}
.pin.sel{transform:scale(1.22);box-shadow:0 0 0 3px var(--black),0 3px 10px rgba(0,0,0,.45)}
.leaflet-marker-icon:focus-visible .pin{outline:3px solid var(--black);outline-offset:2px}
.pin small{font-size:10px;font-weight:700;margin-left:2px;opacity:.85}

/* open-list button + legend */
#openlist{position:absolute;top:12px;left:12px;z-index:900;background:var(--black);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);min-height:42px}
#openlist:focus-visible,.x:focus-visible,.back:focus-visible,.item:focus-visible,.rate:focus-visible{outline:3px solid #0E6E7E;outline-offset:2px}
#legend{position:absolute;left:12px;bottom:26px;z-index:800;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;max-width:calc(100% - 90px)}
#legend ul{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px}
#legend li{display:flex;align-items:center;gap:5px;font-weight:700}
#legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
#legend .st{color:var(--slate)}

/* side panel */
#panel{position:absolute;top:0;left:0;bottom:0;width:390px;max-width:100%;z-index:1000;background:var(--paper);box-shadow:4px 0 24px rgba(0,0,0,.25);transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;visibility:hidden}
#panel.open{transform:none;visibility:visible}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--black);color:#fff;padding:12px 14px;flex:none}
.phead h1{margin:0;font-size:17px;font-weight:700}
.x{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;min-width:40px;min-height:40px}
.back{background:none;border:0;color:#fff;font-weight:700;font-size:14px;cursor:pointer;padding:8px 6px;min-height:40px}
.pbody{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}

/* list view */
.rates{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rate{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:32px}
.rate i{width:12px;height:12px;border-radius:50%;display:inline-block}
.rate em{font-style:normal;font-weight:600;color:var(--slate);font-size:11.5px}
.rate[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.rate[aria-pressed=true] em{color:#cfd8da}
.rate[disabled]{opacity:.4;cursor:default}
.clr{border:0;background:none;color:var(--slate);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:6px 4px}
.item{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 14px 12px 0;cursor:pointer}
.item:hover{background:var(--glass)}
.item .bar{align-self:stretch;background:var(--r)}
.item b{display:block;font-size:15px}
.item span{display:block;color:var(--slate);font-size:12.5px}
.item .h{text-align:right;font-weight:800;font-size:16px}
.item .h small{font-size:11px;font-weight:700;color:var(--slate)}
.empty{padding:18px 14px;color:var(--slate)}

/* detail view */
.ph{height:150px;background:var(--black);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.nop{height:0}
.dt{padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px;border-left:6px solid var(--r)}
.dt h2{margin:0;font-size:22px;line-height:1.2;color:var(--black)}
.reg{color:var(--slate);font-size:13px;margin-top:2px}
.rating{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rw{font-weight:800;font-size:16px;letter-spacing:.02em;color:var(--r)}
.spec{display:flex;gap:4px}
.spec i{width:28px;height:8px;border-radius:4px;background:#E3E9EA;display:block}
.surf{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:34px;font-weight:800;line-height:1;color:var(--black)}
.big small{font-size:15px;font-weight:700;margin-left:3px;color:var(--slate)}
.rel{color:var(--slate)}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
dl div{background:var(--glass);border-radius:10px;padding:8px 11px}
dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:700}
dd{margin:2px 0 0}
dd b{display:block;font-size:15px}
dd span{display:block;color:var(--slate);font-size:12.5px}
.swells{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:5px}
.swells li{display:grid;grid-template-columns:20px 62px 40px 1fr;gap:8px;align-items:center;font-size:14px}
.swells .ar{width:16px;height:16px;color:var(--slate)}
.swells .d{color:var(--slate)}
.swells .src{display:block;font-size:12px;color:var(--slate)}
.guide{margin:0;color:var(--ink);font-size:14.5px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{display:inline-block;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
.links .p{background:var(--black);color:#fff}
.links .s{border:1.5px solid var(--black);color:var(--black)}
.na{color:var(--slate);margin:0}
.credit{font-size:11.5px;color:var(--slate);padding:0 18px 20px}
.credit a{color:var(--slate)}
@media (max-width:600px){#panel{width:100%}#legend{display:none}.big{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Map of Kauaʻi surf spots"></div>
  <button id="openlist" type="button" aria-controls="panel">☰ Spots</button>
  <div id="legend"><ul id="lg" aria-label="Rating colours"></ul><div class="st" id="stamp"></div></div>
  <aside id="panel" aria-label="Surf spot information">
    <div id="v-list" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="phead"><h1>Kauaʻi surf spots</h1><button class="x" type="button" data-close aria-label="Close panel">×</button></div>
      <div class="pbody"><div class="rates" id="rates" role="group" aria-label="Filter by rating"></div><div id="items"></div>
      <p class="credit" style="padding-top:14px">Ratings, surf, swell and wind come from <a href="https://www.surfline.com" target="_blank" rel="noopener">Surfline</a>. Tide and water temperature come from <a href="https://tidesandcurrents.noaa.gov" target="_blank" rel="noopener">NOAA</a>. Conditions change quickly. Check the water yourself before you go in.</p></div>
    </div>
    <div id="v-detail" style="display:none;flex-direction:column;min-height:0;flex:1">
      <div class="phead"><button class="back" type="button" id="back">← All spots</button><button class="x" type="button" data-close aria-label="Close panel">×</button></div>
      <div class="pbody" id="detail"></div>
    </div>
  </aside>
</div>
<script>
__LEAFLET_JS__
</script>
<script>
const KC = __DATA__;
(function(){
'use strict';
var SCALE=[
 {k:'VERY_POOR',   t:'Very poor',   c:'#D5586D', n:1},
 {k:'POOR',        t:'Poor',        c:'#E69938', n:2},
 {k:'POOR_TO_FAIR',t:'Poor to fair',c:'#EFCD4E', n:3},
 {k:'FAIR',        t:'Fair',        c:'#74D27D', n:4},
 {k:'FAIR_TO_GOOD',t:'Fair to good',c:'#4F9073', n:5},
 {k:'GOOD',        t:'Good',        c:'#6D57EC', n:5},
 {k:'EPIC',        t:'Epic',        c:'#5E2ABF', n:5}
];
var FLAT={k:'FLAT',t:'Flat',c:'#8B9499',n:0};
var ALIAS={GOOD_TO_EPIC:{i:5.5,s:{k:'GOOD_TO_EPIC',t:'Good to epic',c:'#6D57EC',n:5}}};
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
var compass=function(d){return (d==null||isNaN(d))?'':DIRS[Math.round(((d%360)+360)%360/22.5)%16];};
var num=function(v,dp){return (v==null||isNaN(v))?'':(+v).toFixed(dp==null?0:dp).replace(/\.0$/,'');};
function level(key){for(var i=0;i<SCALE.length;i++)if(SCALE[i].k===key)return {i:i,s:SCALE[i]};if(key==='FLAT')return {i:-1,s:FLAT};if(ALIAS[key])return ALIAS[key];return {i:-0.5,s:{k:key,t:String(key).replace(/_/g,' '),c:'#8B9499',n:0}};}
function tfmt(iso){if(!iso)return '';return new Intl.DateTimeFormat('en-US',{timeZone:'Pacific/Honolulu',hour:'numeric',minute:'2-digit'}).format(new Date(iso)).replace(' AM',' am').replace(' PM',' pm');}
function ink(hex){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)>150?'#111':'#fff';}
function rkey(s){var L=s.rating?level(s.rating.key):null;if(!L)return 'NONE';return L.s.k==='GOOD_TO_EPIC'?'GOOD':L.s.k;}
function col(s){var L=s.rating?level(s.rating.key):null;return L?L.s.c:'#8B9499';}
function word(s){var L=s.rating?level(s.rating.key):null;return L?L.s.t:'No rating';}
function range(s){if(!s.surf||s.surf.min==null)return '';return (s.surf.min===s.surf.max)?num(s.surf.max):num(s.surf.min)+'–'+num(s.surf.max);}
var arrow='<svg class="ar" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(%ddeg)"><path d="M12 3v15M6 12l6 7 6-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var spots=KC.spots.filter(function(s){return s.lat!=null&&s.lon!=null;});
var S={sel:null,rates:{}};

/* ---- map ---- */
var map=L.map('map',{zoomControl:false,zoomSnap:0.25,minZoom:9,maxZoom:17});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer(KC.tiles,{subdomains:KC.subdomains||'abc',maxZoom:19,attribution:KC.attribution}).addTo(map);
var bounds=L.latLngBounds(spots.map(function(s){return [s.lat,s.lon];}));
map.fitBounds(bounds,{padding:[70,70],maxZoom:11});
var markers={};
function pinHtml(s,sel){var c=col(s),r=range(s);return '<div class="pin'+(sel?' sel':'')+'" style="background:'+c+';color:'+ink(c)+'">'+(r?esc(r)+'<small>ft</small>':'–')+'</div>';}
function drawMarkers(){
  Object.keys(markers).forEach(function(k){map.removeLayer(markers[k]);});markers={};
  visible().forEach(function(s){
    var sel=S.sel===s.id;
    var m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:pinHtml(s,sel),iconSize:[null,null],iconAnchor:[24,14]}),title:s.name+', '+word(s)+(range(s)?', '+range(s)+' ft':''),keyboard:true,riseOnHover:true,zIndexOffset:sel?1000:0}).addTo(map);
    m.on('click',function(){select(s.id);});
    markers[s.id]=m;
  });
}
function visible(){var any=Object.keys(S.rates).some(function(k){return S.rates[k];});return spots.filter(function(s){return !any||S.rates[rkey(s)];});}

/* ---- panel ---- */
var panel=$('#panel');
function openPanel(){panel.classList.add('open');$('#openlist').style.display='none';}
function closePanel(){panel.classList.remove('open');$('#openlist').style.display='';S.sel=null;drawMarkers();}
function show(v){$('#v-list').style.display=v==='list'?'flex':'none';$('#v-detail').style.display=v==='detail'?'flex':'none';}
function score(s){var L=s.rating?level(s.rating.key):null;return L?L.i:-2;}

function renderList(){
  var cnt={};spots.forEach(function(s){var k=rkey(s);cnt[k]=(cnt[k]||0)+1;});
  var any=Object.keys(S.rates).some(function(k){return S.rates[k];});
  $('#rates').innerHTML=SCALE.concat([FLAT]).map(function(l){var n=cnt[l.k]||0,on=!!S.rates[l.k];return '<button type="button" class="rate" data-k="'+l.k+'" aria-pressed="'+on+'"'+((!n&&!on)?' disabled':'')+'><i style="background:'+l.c+'"></i>'+esc(l.t)+' <em>'+n+'</em></button>';}).join('')+(any?'<button type="button" class="clr" data-k="__clear">Clear filter</button>':'');
  var list=visible().slice().sort(function(a,b){return score(b)-score(a)||a.name.localeCompare(b.name);});
  $('#items').innerHTML=list.length?list.map(function(s){var r=range(s);return '<button type="button" class="item" data-id="'+esc(s.id)+'" style="--r:'+col(s)+'"><span class="bar"></span><div><b>'+esc(s.name)+'</b><span>'+esc(word(s))+' · '+esc(s.region)+'</span></div><div class="h">'+(r?esc(r)+' <small>ft</small>':'')+'</div></button>';}).join(''):'<p class="empty">No spots match that rating right now.</p>';
}

function renderDetail(s){
  var L=s.rating?level(s.rating.key):null,c=col(s);
  var spec='';if(L){for(var b=0;b<5;b++)spec+='<i'+(b<L.s.n?' style="background:'+L.s.c+'"':'')+'></i>';}
  var surf='';
  if(range(s)){surf='<div class="surf"><span class="big">'+esc(range(s))+(s.surf.plus?'+':'')+'<small>ft</small></span><span class="rel">'+esc(s.surf.rel||'')+'</span></div>';}
  else surf='<p class="na">Surf height unavailable right now. See the full report on Surfline.</p>';
  var w='',t='',wt='',air='';
  if(s.wind&&s.wind.speed!=null)w='<div><dt>Wind</dt><dd><b>'+num(s.wind.speed)+' '+esc(s.wind.unit||'kts')+' '+esc(compass(s.wind.dir))+'</b><span>'+esc(s.wind.type||'')+(s.wind.gust!=null?(s.wind.type?', ':'')+'gusts '+num(s.wind.gust):'')+'</span></dd></div>';
  if(s.tide&&s.tide.height!=null)t='<div><dt>Tide</dt><dd><b>'+num(s.tide.height,1)+' ft '+(s.tide.trend==='rising'?'↑ rising':s.tide.trend==='falling'?'↓ falling':'')+'</b>'+(s.tide.next?'<span>'+(s.tide.next.type==='H'?'High':'Low')+' '+esc(tfmt(s.tide.next.time))+', '+num(s.tide.next.height,1)+' ft</span>':'')+'</dd></div>';
  if(s.water!=null)wt='<div><dt>Water</dt><dd><b>'+num(s.water)+'°F</b></dd></div>';
  if(s.air!=null)air='<div><dt>Air</dt><dd><b>'+num(s.air)+'°F</b><span>'+esc(s.cond||'')+'</span></dd></div>';
  var grid=(w||t||wt||air)?'<dl>'+w+t+wt+air+'</dl>':'';
  var sw='';
  if(s.swells&&s.swells.length){sw='<ul class="swells" aria-label="Swells">';s.swells.slice(0,3).forEach(function(x){if(!x||!x.h)return;sw+='<li>'+arrow.replace('%d',Math.round(x.dir||0))+'<b>'+num(x.h,1)+' ft</b><span>'+num(x.p)+'s</span><span class="d">'+esc(compass(x.dir))+' '+num(x.dir)+'°</span></li>';});
    if(s.swell_src)sw+='<li class="src">Swell from '+esc(s.swell_src.name)+' (NOAA), '+esc(tfmt(new Date(s.swell_src.time*1000).toISOString()))+'</li>';sw+='</ul>';}
  var img=s.photo?'<div class="ph"><img src="'+esc(s.photo)+'" alt="" onerror="this.parentNode.classList.add(\'nop\');this.remove()"></div>':'';
  $('#detail').innerHTML=img+'<div class="dt" style="--r:'+c+'"><div><h2>'+esc(s.name)+'</h2><div class="reg">'+esc(s.region)+' shore</div></div>'
   +'<div class="rating"><div class="rw">'+esc(word(s))+'</div><div class="spec" aria-hidden="true">'+spec+'</div></div>'+surf+grid+sw
   +(s.guide?'<p class="guide">'+esc(s.guide)+'</p>':'')
   +'<div class="links">'+(s.page?'<a class="p" href="'+esc(s.page)+'" target="_top">Spot guide</a>':'')+'<a class="s" href="'+esc(s.surfline)+'" target="_blank" rel="noopener">Full report on Surfline ↗</a></div></div>'
   +'<p class="credit">Ratings, surf, swell and wind from <a href="https://www.surfline.com" target="_blank" rel="noopener">Surfline</a>; tide and water temperature from <a href="https://tidesandcurrents.noaa.gov" target="_blank" rel="noopener">NOAA</a>. Check the water yourself before you go in.</p>';
  $('#detail').scrollTop=0;
}

function select(id){
  var s=spots.filter(function(x){return x.id===id;})[0];if(!s)return;
  S.sel=id;renderDetail(s);show('detail');openPanel();drawMarkers();
  var z=Math.max(map.getZoom(),11.5),w=window.innerWidth>600?Math.min(390,innerWidth)/2:0;
  var p=map.project([s.lat,s.lon],z).subtract([w,0]);
  map.setView(map.unproject(p,z),z,{animate:true});
  $('#back').focus({preventScroll:true});
}
function showList(){S.sel=null;renderList();show('list');drawMarkers();}

$('#openlist').addEventListener('click',function(){showList();openPanel();});
$('#back').addEventListener('click',showList);
document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closePanel);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('open'))closePanel();});
$('#items').addEventListener('click',function(e){var b=e.target.closest('.item');if(b)select(b.dataset.id);});
$('#rates').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.k==='__clear')S.rates={};else S.rates[b.dataset.k]=!S.rates[b.dataset.k];renderList();drawMarkers();});
map.on('click',function(){if(panel.classList.contains('open')&&S.sel){showList();}});

/* legend + timestamp */
$('#lg').innerHTML=SCALE.concat([FLAT]).map(function(l){return '<li><i style="background:'+l.c+'"></i>'+esc(l.t)+'</li>';}).join('');
var g=new Date(KC.generated),ago=(Date.now()-g.getTime())/36e5;
var f=new Intl.DateTimeFormat('en-US',{timeZone:'Pacific/Honolulu',weekday:'short',hour:'numeric',minute:'2-digit'}).format(g).replace(' AM',' am').replace(' PM',' pm');
$('#stamp').textContent='Updated '+f+' Hawaiʻi time'+(!KC.sample&&ago>2.5?' (about '+Math.round(ago)+' h old)':'')+(KC.sample?' · preview':'');
drawMarkers();renderList();
})();
</script>
</body>
</html>
