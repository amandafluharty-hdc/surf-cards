<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kauaʻi surf reports | Kauaʻi Connect</title>
<style>
:root{--ink:#19262B;--slate:#566A71;--line:#D5DFE0;--glass:#F2F6F6;--paper:#fff;--accent:#0E6E7E}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 "Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--paper);padding:4px 2px 28px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin:0 0 16px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tools{display:flex;gap:12px;align-items:center;color:var(--slate);font-size:13px}
.tools select{height:36px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;color:var(--ink);background:#fff}
.stamp{color:var(--slate);font-size:13px;margin:0 0 14px}
.stale{display:none;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#FFF4D6;border:1px solid #F0CE4E;font-size:13.5px}
.stale.on{display:block}
.sample{display:none;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#E8F1F3;border:1px dashed var(--accent);font-size:13.5px}
.sample.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.card{--r:#B8C0C4;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--r);z-index:2}
.ph{aspect-ratio:16/7;background:#111;position:relative;overflow:hidden}
.ph .pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.nop .ph{aspect-ratio:auto;height:52px}
.ph .rg{z-index:1;position:absolute;left:18px;bottom:10px;background:rgba(255,255,255,.94);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:650}
.body{padding:16px 18px 14px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
h3{margin:0;font-size:19px;line-height:1.2;letter-spacing:-.01em}
h3 a{text-decoration:none}
h3 a:hover{text-decoration:underline}
.rating{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.rw{font-size:24px;font-weight:800;letter-spacing:.005em;line-height:1;color:var(--r)}
.spec{display:flex;gap:4px;flex:none}
.spec i{width:28px;height:8px;border-radius:2px;background:#E3E7E9}
.surf{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.surf .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.surf .big small{font-size:17px;font-weight:700;margin-left:3px}
.surf .rel{color:var(--slate);font-weight:600}
.nosurf{color:var(--slate);font-size:14px}
dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0}
dl div{min-width:0}
dt{color:var(--slate);font-size:12.5px;font-weight:600;margin-bottom:1px}
dd{margin:0}
dd b{font-size:15.5px;font-weight:700}
dd span{display:block;color:var(--slate);font-size:13px}
.swells{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:5px}
.swells li{display:grid;grid-template-columns:20px 62px 40px 1fr;gap:8px;align-items:center;font-size:14px}
.swells .ar{display:inline-block;width:16px;height:16px;color:var(--slate)}
.swells b{font-weight:700}
.swells .d{color:var(--slate)}
.na{color:var(--slate);font-size:14px;padding:6px 0}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;margin-top:auto}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.rates{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.rate{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 8px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;min-height:34px;color:var(--ink)}
.rate i{width:14px;height:14px;border-radius:50%;display:inline-block}
.rate em{font-style:normal;font-weight:600;color:var(--slate);font-size:12px}
.rate[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.rate[aria-pressed=true] em{color:#cfd8da}
.rate[disabled]{opacity:.4;cursor:default}
.rates .clr{border:0;background:none;font:inherit;font-size:13px;color:var(--slate);text-decoration:underline;cursor:pointer;padding:6px 4px}
.empty{grid-column:1/-1;color:var(--slate);padding:18px 4px}
.credit{margin-top:22px;color:var(--slate);font-size:12.5px;max-width:78ch}
.credit a{color:var(--slate)}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const KC = {"generated":"2026-11-04T14:01:36.849564-10:00","sample":false,"sampleNote":"","regions":["North","East","Lihue","South","West"],"spots":[{"id":"5842041f4e65fad6a7708b30","name":"Poipu Outer Reef","region":"South","page":"https://kauaiconnect.com/surf-spot/poipu-outer-reef/","surfline":"https://www.surfline.com/surf-report/poipu-outer-reef/5842041f4e65fad6a7708b30","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3702.624891518718!2d-159.4645749247198!3d21.87199997999679!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjHCsDUyJzE5LjIiTiAxNTnCsDI3JzQzLjIiVw!5e0!3m2!1sen!2sus!4v1714433523309!5m2!1sen!2sus","guide":"Poipu Outer Reef offers a heavy left barrel over very shallow reef. It is safest on a high tide. It also offers a longer, more sloped right. There are mellower and more popular spots closer to the beach, such as Lemon Drops and Waiohai, and heading west past Poipu, you will find an array of other surf spots, namely PKs, Centers, Heroins and Acid Drop. All of these waves have varying moods depending on swell, but all can be dangerous because of the shallow reef bottom.","lat":21.872,"lon":-159.46457,"photo":"https://kauaiconnect.com/wp-content/uploads/5842041f4e65fad6a7708b30_1.jpg","rating":{"key":"POOR_TO_FAIR","value":2},"surf":{"min":2,"max":3,"plus":false,"rel":"Thigh to waist"},"swells":[{"h":1.6,"p":9,"dir":156},{"h":0.8,"p":17,"dir":202.6},{"h":1.8,"p":6,"dir":135.1}],"wind":{"speed":19.7,"dir":69.95468,"type":"Offshore","gust":25.1,"unit":"kts","src_unit":"KTS"},"air":78.8,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"5842041f4e65fad6a7708b31","name":"Pakala","region":"West","page":"https://kauaiconnect.com/surf-spot/pakala","surfline":"https://www.surfline.com/surf-report/pakala/5842041f4e65fad6a7708b31","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3700.962319529014!2d-159.65457492471793!3d21.935999979950207!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjHCsDU2JzA5LjYiTiAxNTnCsDM5JzA3LjIiVw!5e0!3m2!1sen!2sus!4v1714433559255!5m2!1sen!2sus","guide":"Pakalas is a long left that barrels as it wraps around the point on the south side of the bay. It is fast, powerful and best on an overhead swell. The lower the tide, the hollower Pakalas gets, but exercise caution because the bottom is coral reef. On weaker swells, Pakalas is far less hollow and a mellower surfing experience overall. Checking Pakalas is a bit tricky, as you can't easily see it from the road. Follow the cars parked along the side of the road.","lat":21.936,"lon":-159.65457,"photo":"https://kauaiconnect.com/wp-content/uploads/5842041f4e65fad6a7708b31_1.jpg","rating":{"key":"POOR","value":1},"surf":{"min":1,"max":2,"plus":false,"rel":"Knee to thigh"},"swells":[{"h":0.9,"p":17,"dir":203.7},{"h":1.6,"p":9,"dir":159.3},{"h":2.2,"p":6,"dir":127.9}],"wind":{"speed":20.6,"dir":79.64729,"type":"Offshore","gust":24.1,"unit":"kts","src_unit":"KTS"},"air":80.042,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"584204214e65fad6a7709bde","name":"PKs/Centers","region":"South","page":"https://kauaiconnect.com/surf-spot/pks-centers","surfline":"https://www.surfline.com/surf-report/pks-centers/584204214e65fad6a7709bde","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3702.410131662508!2d-159.47735492471958!3d21.880277079990865!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjHCsDUyJzQ5LjAiTiAxNTnCsDI4JzI5LjIiVw!5e0!3m2!1sen!2sus!4v1714433902983!5m2!1sen!2sus","guide":"PKs in Kauai is an exposed reef break that has fairly consistent surf. Summer offers the best conditions for surfing. Offshore winds are from the north northeast. Tends to receive a mix of groundswells and windswells and the best swell direction is from the south. The reef provides both left and right breaks. Surfable at all stages of the tide. It's sometimes crowded here. Take care of urchins, rips and rocks.","lat":21.88028,"lon":-159.47735,"photo":"https://kauaiconnect.com/wp-content/uploads/584204214e65fad6a7709bde_1.jpg","rating":{"key":"POOR_TO_FAIR","value":2},"surf":{"min":1,"max":2,"plus":false,"rel":"Knee to thigh"},"swells":[{"h":1.6,"p":9,"dir":156},{"h":0.8,"p":17,"dir":202.6},{"h":1.8,"p":6,"dir":135.1}],"wind":{"speed":19.7,"dir":69.95468,"type":"Offshore","gust":25.1,"unit":"kts","src_unit":"KTS"},"air":78.8,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"5842041f4e65fad6a7708b2d","name":"Ha'ena Bay (Cannons/Tunnels)","region":"North","page":"https://kauaiconnect.com/surf-spot/haena-bay-cannons-tunnels","surfline":"https://www.surfline.com/surf-report/ha-ena-bay-cannons-tunnels-/5842041f4e65fad6a7708b2d","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3693.397292464296!2d-159.56957492470963!3d22.224999979740858!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjLCsDEzJzMwLjAiTiAxNTnCsDM0JzAxLjIiVw!5e0!3m2!1sen!2sus!4v1714433309598!5m2!1sen!2sus","guide":"Heading west past Hanalei and Wainiha Bays, you'll run into beautiful Ha’Ena Beach, a goofy or regular footer's dream in the winter. On the eastern side of the shallow bay is Tunnels, a right-hander breaking over shallow reef, which on a proper N to NE swell it will quickly make you realize this wave has a very appropriate name. The paddle-out to Tunnels is a long one, but gets you warmed up for the waves waiting beyond. On the other side of the bay is Cannons, an equally hollow and shallow left that really gets going on a solid N to NW swell. The paddle-out to Cannons isn't as long as Tunnels. Like most surf spots in Kauai, Ha’Ena is breathtaking -- crystal clear water and jagged green mountains rising beyond the white sand beach. Ha’Ena is, however, a popular surf spot, especially in winter, and visiting surfers should pay special attention to the local crew in the water at all times.","lat":22.225,"lon":-159.56957,"photo":"https://kauaiconnect.com/wp-content/uploads/5842041f4e65fad6a7708b2d_1.jpg","rating":{"key":"POOR","value":1},"surf":{"min":4,"max":5,"plus":false,"rel":"Chest to head"},"swells":[{"h":3.2,"p":11,"dir":340},{"h":6.1,"p":8,"dir":59.1},{"h":0.6,"p":23,"dir":335}],"wind":{"speed":18.3,"dir":74.87351,"type":"Cross-shore","gust":22.0,"unit":"kts","src_unit":"KTS"},"air":76.118,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"5842041f4e65fad6a7708b2c","name":"Hanalei Bay","region":"North","page":"https://kauaiconnect.com/surf-spot/hanalei-bay","surfline":"https://www.surfline.com/surf-report/hanalei-bay/5842041f4e65fad6a7708b2c","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3693.6343001357136!2d-159.50457492470994!3d22.215999979747302!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjLCsDEyJzU3LjYiTiAxNTnCsDMwJzA3LjIiVw!5e0!3m2!1sen!2sus!4v1714433404869!5m2!1sen!2sus","guide":"Hanalei Bay is one of the most well-known spots on the island of Kauai, and there are many other spots in and around the bay. Hanalei itself is a long right point that breaks on the eastern side of the bay for up to 300 yards over lava reef. It is a fairly powerful wave with occasional barrel sections that ends with an inside bowl section in the middle of the bay. Farther north, up and around the point from Hanalei, is a reefbreak right called Hideaways. Further inside the bay is PineTrees, which needs a larger swell and a good sandbar setup at the rivermouth. Directly across Hanalei Bay from the main point is a fickle left reefbreak called Waikokos, which needs a large N swell and W wind.","lat":22.216,"lon":-159.50457,"photo":"https://kauaiconnect.com/wp-content/uploads/5842041f4e65fad6a7708b2c_1.jpg","rating":{"key":"POOR_TO_FAIR","value":2},"surf":{"min":4,"max":6,"plus":false,"rel":"Chest to overhead"},"swells":[{"h":3.2,"p":11,"dir":340.6},{"h":6.2,"p":8,"dir":60.7},{"h":0.6,"p":23,"dir":334.2}],"wind":{"speed":14.3,"dir":71.46749,"type":"Offshore","gust":19.8,"unit":"kts","src_unit":"KTS"},"air":77.81,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"5842041f4e65fad6a7708df1","name":"Polihale","region":"West","page":"https://kauaiconnect.com/surf-spot/polihale","surfline":"https://www.surfline.com/surf-report/polihale/5842041f4e65fad6a7708df1","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3696.6547071883356!2d-159.74957492471324!3d22.100999979830423!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjLCsDA2JzAzLjYiTiAxNTnCsDQ0JzQ5LjIiVw!5e0!3m2!1sen!2sus!4v1714434010938!5m2!1sen!2sus","guide":"Along Polihale Beach there are numerous beachbreak setups to enjoy in both summer and winter. Unlike nearby Mana, Polihale picks up more swell from the North than the South Pacific, though a good S swell will wrap in just fine. Combo swells will yield the best surf, distributing fun peaks up and down the beach. Because Polihale is so sweeping and predominantly sand, watch out for shifty surf and strong currents during larger swell events.","lat":22.101,"lon":-159.74957,"photo":"https://kauaiconnect.com/wp-content/uploads/5842041f4e65fad6a7708df1_1.jpg","rating":{"key":"FAIR","value":3},"surf":{"min":2,"max":3,"plus":true,"rel":"Thigh to stomach"},"swells":[{"h":2.9,"p":11,"dir":339.1},{"h":3.9,"p":8,"dir":26.5},{"h":0.6,"p":23,"dir":333.6}],"wind":{"speed":6.0,"dir":35.38863,"type":"Cross-shore","gust":10.3,"unit":"kts","src_unit":"KTS"},"air":84.02,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"640f37e374a71b7f86295289","name":"Shipwrecks","region":"South","page":"https://kauaiconnect.com/surf-spot/shipwrecks","surfline":"https://www.surfline.com/surf-report/shipwrecks/640f37e374a71b7f86295289","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3702.5730060620654!2d-159.43977492471979!3d21.873999979995293!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjHCsDUyJzI2LjQiTiAxNTnCsDI2JzEzLjkiVw!5e0!3m2!1sen!2sus!4v1714433954603!5m2!1sen!2sus","guide":"Shipwrecks  is an exposed beach and reef break that is often working. Summer offers the favoured conditions for surfing. Offshore winds blow from the north. Groundswells are more common than windswells and the ideal swell direction is from the south southeast. Surfable at all stages of the tide. It very rarely gets crowded here. Take care of rocks and locals.","lat":21.874,"lon":-159.43977,"photo":"https://kauaiconnect.com/wp-content/uploads/640f37e374a71b7f86295289_1.jpg","rating":{"key":"POOR_TO_FAIR","value":2},"surf":{"min":1,"max":2,"plus":false,"rel":"Knee to thigh"},"swells":[{"h":1.5,"p":9,"dir":160.1},{"h":0.8,"p":17,"dir":202.6},{"h":4.7,"p":8,"dir":85.6}],"wind":{"speed":21.2,"dir":66.28386,"type":"Cross-shore","gust":24.7,"unit":"kts","src_unit":"KTS"},"air":77.99,"cond":"Clear","tide":{"height":1.4,"trend":"falling","next":{"type":"L","time":"2026-11-04T18:53:00-10:00","height":0.1}},"water":81},{"id":"640f37ef326c179b795b7627","name":"Kalapaki Beach","region":"Lihue","page":"https://kauaiconnect.com/surf-spot/kalapaki-beach","surfline":"https://www.surfline.com/surf-report/kalapaki-beach/640f37ef326c179b795b7627","maplink":"https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3700.3351853191434!2d-159.3528449247173!3d21.96009517993274!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjHCsDU3JzM2LjMiTiAxNTnCsDIxJzAxLjAiVw!5e0!3m2!1sen!2sus!4v1714434063084!5m2!1sen!2sus","guide":"Kalapaki Beach is an exposed reef break that has quite reliable surf. Summer offers the optimum conditions for surfing. Offshore winds blow from the northwest. Waves just as likely from local windswells as from distant groundswells and the ideal swell direction is fr
